<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Admin Login – ZENVY Portal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config={darkMode:"class",theme:{extend:{colors:{"background":"#fbf9f8","surface-variant":"#e4e2e2","primary-container":"#1c1b1b","on-primary":"#ffffff","error":"#ba1a1a","error-container":"#ffdad6","on-surface":"#1b1c1c","secondary":"#003ec6","surface-container-low":"#f5f3f3","on-surface-variant":"#444748","secondary-container":"#0052fe","on-secondary":"#ffffff","surface":"#fbf9f8","outline":"#747878","primary":"#000000","outline-variant":"#c4c7c7"},fontFamily:{"body-lg":["Inter"],"label-md":["Inter"],"headline-md":["Montserrat"],"headline-lg":["Montserrat"],"body-md":["Inter"]}}}}
</script>
<style>
  .ambient-shadow{box-shadow:0 20px 40px rgba(0,0,0,0.06);}
  .field-wrap{position:relative;margin-bottom:18px;}
  .field-wrap input{width:100%;border:1px solid #c4c7c7;border-radius:10px;padding:12px 16px;font-family:Inter;font-size:15px;outline:none;background:#fff;transition:border-color .2s;}
  .field-wrap input:focus{border-color:#003ec6;border-width:2px;}
  .field-wrap label{display:block;font-family:Inter;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#444748;margin-bottom:5px;}
</style>
</head>
<body class="bg-surface-container-low text-on-surface antialiased min-h-screen flex items-center justify-center p-4 font-body-md">

<div class="w-full max-w-md bg-white rounded-3xl p-8 md:p-10 ambient-shadow border border-outline-variant/40">
  <!-- Brand Header -->
  <div class="text-center mb-6">
    <a href="../index.html" class="font-headline-lg text-3xl font-black tracking-tighter text-primary block mb-2">ZENVY</a>
    <span class="inline-flex items-center gap-1.5 bg-secondary/10 text-secondary font-label-md text-xs uppercase tracking-widest px-3.5 py-1 rounded-full font-bold">
      <span class="material-symbols-outlined text-sm">admin_panel_settings</span>
      Admin Portal
    </span>
  </div>

  <h2 class="font-headline-md text-xl text-primary mb-1 text-center">Admin Sign In</h2>
  <p class="font-body-md text-xs text-on-surface-variant text-center mb-6">Sign in with your Gmail or Admin Credentials to access dashboard.</p>

  <!-- Error alert -->
  <div id="login-error" class="hidden bg-error-container text-error rounded-xl p-3.5 mb-5 text-xs font-bold flex items-center gap-2">
    <span class="material-symbols-outlined text-base">error</span>
    <span id="error-text">Login failed</span>
  </div>

  <!-- GOOGLE ADMIN LOGIN BUTTON -->
  <button onclick="handleGoogleAdminLogin()" class="w-full bg-white border border-outline-variant hover:bg-surface-container-low text-primary font-label-md text-sm px-6 py-3.5 rounded-xl font-bold flex items-center justify-center gap-3 transition-all ambient-shadow mb-5">
    <svg class="w-5 h-5" viewBox="0 0 24 24">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
    </svg>
    Sign In with Google (Gmail Admin)
  </button>

  <div class="flex items-center gap-3 mb-5">
    <hr class="flex-1 border-outline-variant/60"/>
    <span class="font-caption text-[11px] uppercase tracking-wider text-on-surface-variant">or admin password</span>
    <hr class="flex-1 border-outline-variant/60"/>
  </div>

  <!-- Form -->
  <form id="admin-login-form" onsubmit="handleLogin(event)">
    <div class="field-wrap">
      <label for="admin-email">Admin Email</label>
      <input type="email" id="admin-email" value="admin@zenvy.com" required placeholder="admin@zenvy.com"/>
    </div>
    <div class="field-wrap">
      <label for="admin-password">Password</label>
      <input type="password" id="admin-password" value="admin123" required placeholder="••••••••"/>
    </div>
    <button type="submit" id="submit-btn" class="w-full bg-primary text-on-primary font-label-md text-sm uppercase px-6 py-3.5 hover:bg-secondary transition-colors tracking-widest rounded-xl font-bold flex items-center justify-center gap-2">
      <span class="material-symbols-outlined text-base">lock</span>
      Sign In to Dashboard
    </button>
  </form>

  <div class="mt-6 text-center border-t border-outline-variant/40 pt-4">
    <a href="../index.html" class="font-label-md text-xs text-on-surface-variant hover:text-secondary inline-flex items-center gap-1">
      <span class="material-symbols-outlined text-sm">arrow_back</span> Back to Storefront
    </a>
  </div>
</div>

<script type="module">
import { adminLogin, adminLoginWithGoogle } from '../js/auth.js';

window.handleGoogleAdminLogin = async function() {
  const errBox = document.getElementById('login-error');
  const errText = document.getElementById('error-text');
  errBox.classList.add('hidden');

  const res = await adminLoginWithGoogle();
  if (res.success) {
    window.location.href = 'index.html';
  } else {
    errText.textContent = res.error || 'Google login failed.';
    errBox.classList.remove('hidden');
  }
};

window.handleLogin = async function(e) {
  e.preventDefault();
  const email = document.getElementById('admin-email').value.trim();
  const password = document.getElementById('admin-password').value;
  const btn = document.getElementById('submit-btn');
  const errBox = document.getElementById('login-error');
  const errText = document.getElementById('error-text');

  errBox.classList.add('hidden');
  btn.disabled = true;

  try {
    const res = await adminLogin(email, password);
    if (res.success) {
      window.location.href = 'index.html';
    } else {
      errText.textContent = res.error || 'Invalid admin credentials.';
      errBox.classList.remove('hidden');
    }
  } catch (err) {
    errText.textContent = err.message || 'Login failed.';
    errBox.classList.remove('hidden');
  } finally {
    btn.disabled = false;
  }
};
</script>
</body>
</html>
