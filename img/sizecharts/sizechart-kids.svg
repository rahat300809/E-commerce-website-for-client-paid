<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradKids" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="badgeGradKids" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadowKids" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" rx="16" fill="url(#bgGradKids)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="65" x2="800" y2="65"/>
    <line x1="0" y1="130" x2="800" y2="130"/>
    <line x1="0" y1="195" x2="800" y2="195"/>
    <line x1="0" y1="260" x2="800" y2="260"/>
    <line x1="0" y1="325" x2="800" y2="325"/>
    <line x1="0" y1="390" x2="800" y2="390"/>
    <line x1="0" y1="455" x2="800" y2="455"/>
  </g>

  <!-- Header Section -->
  <g transform="translate(36, 32)">
    <rect width="138" height="26" rx="6" fill="url(#badgeGradKids)"/>
    <text x="69" y="17" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" letter-spacing="1" text-anchor="middle">KIDS EDITION</text>
    <text x="150" y="20" fill="#ddd6fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">YOUTH ACADEMY SIZES (বয়স ৫ - ১৫ বছর)</text>
    <text x="0" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" letter-spacing="0.5">KIDS / JUNIOR KIT SIZE CHART</text>
  </g>

  <!-- Left: Illustrated Jersey Silhouette with Dimension Guides -->
  <g transform="translate(40, 115)" filter="url(#shadowKids)">
    <!-- Base Card -->
    <rect width="240" height="340" rx="12" fill="#2e1065" stroke="#4c1d95" stroke-width="1"/>
    
    <!-- Jersey Outline (Youth Proportion) -->
    <path d="M 72 75 L 95 75 C 105 85, 135 85, 145 75 L 168 75 L 195 102 L 172 124 L 160 114 L 160 250 L 80 250 L 80 114 L 68 124 L 45 102 Z" 
          fill="#1e1b4b" stroke="#a78bfa" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Collar Line -->
    <path d="M 95 75 C 105 92, 135 92, 145 75" fill="none" stroke="#c4b5fd" stroke-width="2"/>
    
    <!-- Measurement Line A (Length) -->
    <line x1="185" y1="75" x2="185" y2="250" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3"/>
    <polygon points="185,70 181,78 189,78" fill="#f59e0b"/>
    <polygon points="185,255 181,247 189,247" fill="#f59e0b"/>
    <rect x="195" y="148" width="36" height="24" rx="4" fill="#f59e0b"/>
    <text x="213" y="164" fill="#000000" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="900" text-anchor="middle">A: লম্বা</text>

    <!-- Measurement Line B (Chest Width) -->
    <line x1="80" y1="145" x2="160" y2="145" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3"/>
    <polygon points="75,145 83,141 83,149" fill="#38bdf8"/>
    <polygon points="165,145 157,141 157,149" fill="#38bdf8"/>
    <rect x="100" y="133" width="40" height="24" rx="4" fill="#38bdf8"/>
    <text x="120" y="149" fill="#000000" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="900" text-anchor="middle">B: বডি</text>

    <!-- Legend -->
    <text x="120" y="295" fill="#f5f3ff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">A = Length (লম্বা) | B = Chest (বডি)</text>
    <text x="120" y="315" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" text-anchor="middle">বয়স ও উচ্চতা অনুযায়ী সাইজ বাছুন</text>
  </g>

  <!-- Right: Sizing Table -->
  <g transform="translate(305, 115)" filter="url(#shadowKids)">
    <!-- Table Container Card -->
    <rect width="455" height="340" rx="12" fill="#2e1065" stroke="#4c1d95" stroke-width="1"/>
    
    <!-- Table Header Row -->
    <rect width="455" height="42" rx="12" fill="#1e1b4b"/>
    <rect y="30" width="455" height="12" fill="#1e1b4b"/>
    <line x1="0" y1="42" x2="455" y2="42" stroke="#4c1d95" stroke-width="1"/>
    
    <text x="30" y="26" fill="#ddd6fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" letter-spacing="1">SIZE (সাইজ)</text>
    <text x="135" y="26" fill="#ddd6fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" letter-spacing="1">AGE (বয়স)</text>
    <text x="235" y="26" fill="#ddd6fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" letter-spacing="1">CHEST / বডি</text>
    <text x="350" y="26" fill="#ddd6fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" letter-spacing="1">LENGTH / লম্বা</text>

    <!-- Table Rows -->
    <!-- Row 22 -->
    <g transform="translate(0, 42)">
      <rect width="455" height="46" fill="#2e1065"/>
      <circle cx="48" cy="23" r="14" fill="#7c3aed" fill-opacity="0.3"/>
      <text x="48" y="28" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="900" text-anchor="middle">22</text>
      <text x="135" y="28" fill="#ddd6fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">5-7 Years</text>
      <text x="235" y="28" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800">28" (14" Flat)</text>
      <text x="350" y="28" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800">20"</text>
      <line x1="20" y1="46" x2="435" y2="46" stroke="#4c1d95" stroke-width="0.8"/>
    </g>

    <!-- Row 24 -->
    <g transform="translate(0, 88)">
      <rect width="455" height="46" fill="#240e53"/>
      <circle cx="48" cy="23" r="14" fill="#7c3aed" fill-opacity="0.3"/>
      <text x="48" y="28" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="900" text-anchor="middle">24</text>
      <text x="135" y="28" fill="#ddd6fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">7-9 Years</text>
      <text x="235" y="28" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800">30" (15" Flat)</text>
      <text x="350" y="28" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800">22"</text>
      <line x1="20" y1="46" x2="435" y2="46" stroke="#4c1d95" stroke-width="0.8"/>
    </g>

    <!-- Row 26 -->
    <g transform="translate(0, 134)">
      <rect width="455" height="46" fill="#2e1065"/>
      <circle cx="48" cy="23" r="14" fill="#7c3aed" fill-opacity="0.3"/>
      <text x="48" y="28" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="900" text-anchor="middle">26</text>
      <text x="135" y="28" fill="#ddd6fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">9-11 Years</text>
      <text x="235" y="28" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800">32" (16" Flat)</text>
      <text x="350" y="28" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800">24"</text>
      <line x1="20" y1="46" x2="435" y2="46" stroke="#4c1d95" stroke-width="0.8"/>
    </g>

    <!-- Row 28 -->
    <g transform="translate(0, 180)">
      <rect width="455" height="46" fill="#240e53"/>
      <circle cx="48" cy="23" r="14" fill="#7c3aed" fill-opacity="0.3"/>
      <text x="48" y="28" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="900" text-anchor="middle">28</text>
      <text x="135" y="28" fill="#ddd6fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">11-13 Years</text>
      <text x="235" y="28" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800">34" (17" Flat)</text>
      <text x="350" y="28" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800">25"</text>
      <line x1="20" y1="46" x2="435" y2="46" stroke="#4c1d95" stroke-width="0.8"/>
    </g>

    <!-- Row 30 -->
    <g transform="translate(0, 226)">
      <rect width="455" height="46" fill="#2e1065"/>
      <circle cx="48" cy="23" r="14" fill="#7c3aed" fill-opacity="0.3"/>
      <text x="48" y="28" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="900" text-anchor="middle">30</text>
      <text x="135" y="28" fill="#ddd6fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">13-15 Years</text>
      <text x="235" y="28" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800">36" (18" Flat)</text>
      <text x="350" y="28" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800">26"</text>
    </g>

    <!-- Pro Tip Callout -->
    <g transform="translate(16, 280)">
      <rect width="423" height="46" rx="8" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="28" cy="23" r="10" fill="#7c3aed" fill-opacity="0.2"/>
      <text x="28" y="28" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="900" text-anchor="middle">★</text>
      <text x="48" y="20" fill="#ddd6fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800">বাচ্চাদের সাইজ গাইড (Junior Size Advice):</text>
      <text x="48" y="35" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500">বাচ্চা দ্রুত বাড়ন্ত হলে অথবা স্বাস্থ্যবান হলে ১ সাইজ বড় নেওয়া উত্তম।</text>
    </g>
  </g>
</svg>
